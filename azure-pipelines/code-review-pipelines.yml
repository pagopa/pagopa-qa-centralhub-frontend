# Code review (PR gate) for pagopa-qa-centralhub-frontend (Next.js).
# Triggered on pull requests towards main by the Azure DevOps build definition.
# ⚠️ assumes package.json exposes the scripts: lint, test, build.

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-22.04'

variables:
  NODE_VERSION: '20.x'
  # dummy value: only needed so `next build` does not fail on a public env var
  NEXT_PUBLIC_API_URL: 'http://localhost'

stages:
  - stage: code_review
    displayName: Code review
    jobs:
      - job: quality
        displayName: Lint, type-check, test, build
        steps:
          - checkout: self
            clean: true
            submodules: true

          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache pnpm
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store

          - script: |
              npm install --global pnpm@10.33.2
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies (pnpm)'

          - script: pnpm lint
            displayName: 'Lint (eslint)'

          - script: pnpm exec tsc --noEmit
            displayName: 'Type-check (tsc)'

          - script: pnpm test
            displayName: 'Unit tests'

          - script: pnpm build
            displayName: 'Build (next build)'
