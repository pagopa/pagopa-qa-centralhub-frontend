parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: uat
    values:
      - dev
      - uat
      - prod
  - name: SEMVER
    displayName: "Version bump to apply. Use skip for deployments without a new release."
    type: string
    values:
      - major
      - minor
      - patch
      - skip
    default: skip

# NOTE: the following variables are injected as pipeline variables by the Terraform
# build definition (pagopa-azure-devops/azure-devops/qa/06_pagopa-qa-centralhub-fe.tf),
# so no variable groups are needed here:
#   IMAGE_REPOSITORY, GITHUB_CONN, GIT_USERNAME, GIT_EMAIL,
#   {ENV}_AZURE_SUBSCRIPTION, {ENV}_WEB_APP_NAME, {ENV}_WEB_APP_RESOURCE_GROUP_NAME,
#   {ENV}_CONTAINER_REGISTRY_SERVICE_CONN, {ENV}_CONTAINER_NAMESPACE,
#   {ENV}_NEXT_PUBLIC_API_URL, {ENV}_NEXTAUTH_URL,
#   {ENV}_NEXTAUTH_SECRET, {ENV}_GOOGLE_CLIENT_ID, {ENV}_GOOGLE_CLIENT_SECRET
variables:
  - ${{ if eq(parameters['ENV'], 'dev') }}:
      - name: AZURE_SUBSCRIPTION
        value: $(DEV_AZURE_SUBSCRIPTION)
      - name: RESOURCE_GROUP
        value: $(DEV_WEB_APP_RESOURCE_GROUP_NAME)
      - name: APP_NAME
        value: $(DEV_WEB_APP_NAME)
      - name: STAGE
        value: "d"
      - name: dockerRegistryServiceConnection
        value: $(DEV_CONTAINER_REGISTRY_SERVICE_CONN)
      - name: dockerNamespace
        value: $(DEV_CONTAINER_NAMESPACE)
      - name: NEXT_PUBLIC_API_URL
        value: $(DEV_NEXT_PUBLIC_API_URL)
      - name: NEXTAUTH_URL
        value: $(DEV_NEXTAUTH_URL)
      - name: NEXTAUTH_SECRET
        value: $(DEV_NEXTAUTH_SECRET)
      - name: GOOGLE_CLIENT_ID
        value: $(DEV_GOOGLE_CLIENT_ID)
      - name: GOOGLE_CLIENT_SECRET
        value: $(DEV_GOOGLE_CLIENT_SECRET)
      - name: poolImage
        value: 'pagopa-dev-linux'
  - ${{ if eq(parameters['ENV'], 'uat') }}:
      - name: AZURE_SUBSCRIPTION
        value: $(UAT_AZURE_SUBSCRIPTION)
      - name: RESOURCE_GROUP
        value: $(UAT_WEB_APP_RESOURCE_GROUP_NAME)
      - name: APP_NAME
        value: $(UAT_WEB_APP_NAME)
      - name: STAGE
        value: "u"
      - name: dockerRegistryServiceConnection
        value: $(UAT_CONTAINER_REGISTRY_SERVICE_CONN)
      - name: dockerNamespace
        value: $(UAT_CONTAINER_NAMESPACE)
      - name: NEXT_PUBLIC_API_URL
        value: $(UAT_NEXT_PUBLIC_API_URL)
      - name: NEXTAUTH_URL
        value: $(UAT_NEXTAUTH_URL)
      - name: NEXTAUTH_SECRET
        value: $(UAT_NEXTAUTH_SECRET)
      - name: GOOGLE_CLIENT_ID
        value: $(UAT_GOOGLE_CLIENT_ID)
      - name: GOOGLE_CLIENT_SECRET
        value: $(UAT_GOOGLE_CLIENT_SECRET)
      - name: poolImage
        value: 'pagopa-uat-linux'
  - ${{ if eq(parameters['ENV'], 'prod') }}:
      - name: AZURE_SUBSCRIPTION
        value: $(PROD_AZURE_SUBSCRIPTION)
      - name: RESOURCE_GROUP
        value: $(PROD_WEB_APP_RESOURCE_GROUP_NAME)
      - name: APP_NAME
        value: $(PROD_WEB_APP_NAME)
      - name: STAGE
        value: "p"
      - name: dockerRegistryServiceConnection
        value: $(PROD_CONTAINER_REGISTRY_SERVICE_CONN)
      - name: dockerNamespace
        value: $(PROD_CONTAINER_NAMESPACE)
      - name: NEXT_PUBLIC_API_URL
        value: $(PROD_NEXT_PUBLIC_API_URL)
      - name: NEXTAUTH_URL
        value: $(PROD_NEXTAUTH_URL)
      - name: NEXTAUTH_SECRET
        value: $(PROD_NEXTAUTH_SECRET)
      - name: GOOGLE_CLIENT_ID
        value: $(PROD_GOOGLE_CLIENT_ID)
      - name: GOOGLE_CLIENT_SECRET
        value: $(PROD_GOOGLE_CLIENT_SECRET)
      - name: poolImage
        value: 'pagopa-prod-linux'
  - ${{ if eq(variables['Build.SourceBranchName'], 'merge') }}:
      - name: SOURCE_BRANCH
        value: "main"
  - ${{ if ne(variables['Build.SourceBranchName'], 'merge') }}:
      - name: SOURCE_BRANCH
        value: ${{ variables['Build.SourceBranchName'] }}
  - name: title
    value: ""
  - name: sha
    value: ""
  - name: tag
    value: ""

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-22.04'

stages:

  # ── Release: bump version in package.json and create GitHub release ────────
  - stage: release_service
    condition: ne('${{ parameters.SEMVER }}', 'skip')
    jobs:
      - job: releaseService
        steps:
          - checkout: self
            clean: true
            persistCredentials: true

          - script: |
              git fetch origin $(SOURCE_BRANCH)
              git checkout $(SOURCE_BRANCH)
            displayName: Checkout source branch

          - script: |
              git config --global user.name "$(GIT_USERNAME)"
              git config --global user.email "$(GIT_EMAIL)"
            displayName: Set Git global config

          - task: Bash@3
            displayName: Bump version in package.json
            name: appversion
            inputs:
              targetType: inline
              script: |
                CURRENT=$(node -p "require('./package.json').version")
                IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
                case "${{ parameters.SEMVER }}" in
                  major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
                  minor) MINOR=$((MINOR+1)); PATCH=0 ;;
                  patch) PATCH=$((PATCH+1)) ;;
                esac
                NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                # update package.json without running npm scripts
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('package.json'));
                  pkg.version = '${NEW_VERSION}';
                  fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                "
                echo "##vso[task.setvariable variable=next;isOutput=true]${NEW_VERSION}"
                echo "New version: ${NEW_VERSION}"
              failOnStderr: true

          - script: |
              git add package.json
              git commit -m "Bump version [skip ci]"
              git push origin $(SOURCE_BRANCH)
            displayName: Commit and push bumped version

          - script: |
              HEAD_SHA=$(git rev-parse HEAD)
              TAG="$(appversion.next)"
              TITLE="Release $(appversion.next)"
              echo "##vso[task.setvariable variable=title]$TITLE"
              echo "##vso[task.setvariable variable=sha]$HEAD_SHA"
              echo "##vso[task.setvariable variable=tag]$TAG"
            displayName: Set release vars

          - task: GitHubRelease@0
            displayName: Create GitHub Release
            inputs:
              gitHubConnection: $(GITHUB_CONN)
              repositoryName: $(Build.Repository.Name)
              action: create
              target: $(sha)
              tagSource: manual
              tag: $(tag)
              title: $(title)
              addChangelog: true

  # ── Build Docker image and deploy to App Service ───────────────────────────
  - stage: build_and_deploy
    condition: not(failed('release_service'))
    jobs:
      - job: buildAndPush
        pool:
          name: $(poolImage)  # self-hosted con Managed Identity per ACR
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            submodules: true

          - script: |
              git fetch origin $(SOURCE_BRANCH)
              git checkout $(SOURCE_BRANCH)
            displayName: Checkout source branch

          - task: Bash@3
            displayName: Read current version
            name: appversion
            inputs:
              targetType: inline
              script: |
                VERSION=$(jq -r '.version' package.json 2>/dev/null \
                  || grep '"version"' package.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
                echo "##vso[task.setvariable variable=next;isOutput=true]${VERSION}"
                echo "Version: ${VERSION}"
              failOnStderr: false

          - task: Docker@2
            displayName: Build image
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(IMAGE_REPOSITORY)'
              command: 'build'
              arguments: '--build-arg NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL) --platform linux/amd64'
              tags: |
                $(Build.BuildId)
                latest
                $(appversion.next)

          - task: Docker@2
            displayName: Push image
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(IMAGE_REPOSITORY)'
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest
                $(appversion.next)

      - job: deploy
        dependsOn: buildAndPush
        pool: $(poolImage)
        variables:
          appversion: $[ dependencies.buildAndPush.outputs['appversion.next'] ]
        steps:
          # Dev and Uat: deploy directly to production slot
          - task: AzureRMWebAppDeployment@4
            displayName: Azure App Service Deploy [DEV]
            condition: in('${{ parameters.ENV }}', 'dev', 'uat')
            inputs:
              appType: webAppContainer
              ConnectedServiceName: '$(AZURE_SUBSCRIPTION)'
              WebAppName: '$(APP_NAME)'
              DockerNamespace: '$(dockerNamespace)'
              DockerRepository: '$(IMAGE_REPOSITORY)'
              DockerImageTag: '$(Build.BuildId)'

          - task: AzureAppServiceSettings@1
            displayName: Set App Settings [DEV]
            condition: in('${{ parameters.ENV }}', 'dev', 'uat')
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              appName: '$(APP_NAME)'
              resourceGroupName: '$(RESOURCE_GROUP)'
              appSettings: |
                [
                  { "name": "NEXTAUTH_URL",        "value": "$(NEXTAUTH_URL)",        "slotSetting": false },
                  { "name": "NEXTAUTH_SECRET",     "value": "$(NEXTAUTH_SECRET)",     "slotSetting": false },
                  { "name": "GOOGLE_CLIENT_ID",    "value": "$(GOOGLE_CLIENT_ID)",    "slotSetting": false },
                  { "name": "GOOGLE_CLIENT_SECRET","value": "$(GOOGLE_CLIENT_SECRET)","slotSetting": false }
                ]

          # Prod: deploy to staging slot, swap happens after approval
          - task: AzureRMWebAppDeployment@4
            displayName: Azure App Service Deploy staging [${{ parameters.ENV }}]
            condition: eq('${{ parameters.ENV }}', 'prod')
            inputs:
              appType: webAppContainer
              ConnectedServiceName: '$(AZURE_SUBSCRIPTION)'
              WebAppName: '$(APP_NAME)'
              DockerNamespace: '$(dockerNamespace)'
              DockerRepository: '$(IMAGE_REPOSITORY)'
              DockerImageTag: '$(Build.BuildId)'
              deployToSlotOrASE: true
              slotName: staging
              resourceGroupName: $(RESOURCE_GROUP)

          - task: AzureAppServiceSettings@1
            displayName: Set App Settings on staging slot [PROD]
            condition: eq('${{ parameters.ENV }}', 'prod')
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              appName: '$(APP_NAME)'
              resourceGroupName: '$(RESOURCE_GROUP)'
              slotName: staging
              appSettings: |
                [
                  { "name": "NEXTAUTH_URL",        "value": "$(NEXTAUTH_URL)",        "slotSetting": false },
                  { "name": "NEXTAUTH_SECRET",     "value": "$(NEXTAUTH_SECRET)",     "slotSetting": false },
                  { "name": "GOOGLE_CLIENT_ID",    "value": "$(GOOGLE_CLIENT_ID)",    "slotSetting": false },
                  { "name": "GOOGLE_CLIENT_SECRET","value": "$(GOOGLE_CLIENT_SECRET)","slotSetting": false }
                ]

  # ── Manual approval + slot swap for Prod ──────────────────────────
  - stage: deployApproval_UAT_PROD
    condition: and(not(failed('build_and_deploy')), eq('${{ parameters.ENV }}', 'prod'))
    dependsOn: build_and_deploy
    jobs:
      - job: waitForApproval
        displayName: Waiting for approval
        pool: server
        timeoutInMinutes: 4320 # 3 days
        steps:
          - task: ManualValidation@0
            displayName: Manual Approval
            inputs:
              onTimeout: reject

      - job: swapSlot
        displayName: Swap staging → production [${{ parameters.ENV }}]
        condition: succeeded('waitForApproval')
        dependsOn: waitForApproval
        steps:
          - task: AzureAppServiceManage@0
            displayName: Swap App Service slot
            inputs:
              ConnectedServiceName: '$(AZURE_SUBSCRIPTION)'
              WebAppName: '$(APP_NAME)'
              ResourceGroupName: $(RESOURCE_GROUP)
              SourceSlot: staging
              SwapWithProduction: true
              Slot: production
